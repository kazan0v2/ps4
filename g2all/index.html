<!DOCTYPE html>
<html>
<head>
<title>PS4 7.00 - 14.02 GoldHEN Host by KAZANOVA</title>
<link rel="stylesheet" href="../style.css">
<script>
(function () {
  var panel = null, button = null, status = null;
  var launcher = null, checker = null;
  var isActive = false, inactiveChecks = 0, busy = false;

  function render() {
    if (!panel) return;
    panel.style.display = isActive ? 'block' : 'none';
    panel.setAttribute('aria-hidden', isActive ? 'false' : 'true');
    if (button) button.disabled = busy || !isActive;
  }

  function setGoldhenActive(active, message) {
    isActive = !!active;
    if (isActive) {
      inactiveChecks = 0;
      if (status) status.textContent = message || 'GoldHEN نشط — زر PS4Debug جاهز.';
    } else {
      busy = false;
      if (status) status.textContent = 'GoldHEN غير نشط.';
    }
    render();
  }

  window.kzSetGoldhenActive = setGoldhenActive;
  window.kzRegisterDebugLauncher = function (run, check) {
    if (typeof run === 'function') launcher = run;
    if (typeof check === 'function') checker = check;
  };

  function init() {
    panel = document.getElementById('kz-debug-panel');
    button = document.getElementById('kz-direct-debug');
    status = document.getElementById('kz-direct-status');
    if (!panel || !button || !status) return;

    button.addEventListener('click', async function () {
      if (!isActive || busy) return;
      if (typeof launcher !== 'function') {
        status.textContent = 'مشغّل PS4Debug غير جاهز لهذا المسار.';
        return;
      }
      busy = true;
      status.textContent = 'جاري تحميل وتشغيل PS4Debug...';
      render();
      try {
        var result = await launcher();
        status.textContent = result || 'تم إرسال طلب تشغيل PS4Debug.';
      } catch (err) {
        status.textContent = 'تعذّر تشغيل PS4Debug: ' + String(err && err.message ? err.message : err);
      } finally {
        busy = false;
        render();
      }
    });

    render();
    window.setInterval(function () {
      if (!isActive || typeof checker !== 'function') return;
      var active = false;
      try { active = checker() === true; } catch (e) { active = false; }
      if (active) {
        inactiveChecks = 0;
      } else {
        inactiveChecks++;
        // Wait for three consecutive failed privilege checks to avoid hiding
        // the control during a short delay while GoldHEN is starting.
        if (inactiveChecks >= 3) setGoldhenActive(false);
      }
    }, 4000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>

</head>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 7.00 to 14.00";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
		else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
